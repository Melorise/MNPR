name: Check

on:
  push:
    branches:
      - unstable
  pull_request:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Check generated Flake declarations
        run: python3 scripts/generate-flake.py --check

      - name: Check Flake outputs
        run: nix --accept-flake-config flake check --no-build
